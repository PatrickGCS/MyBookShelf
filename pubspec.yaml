name: gestordelivros
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.3.0
  path: ^1.9.0
  provider: ^6.1.1
  intl: ^0.19.0
  shared_preferences: ^2.2.0
  # Busca online de capas e dados (Open Library / Google Books)
  http: ^1.2.0
  # Lembrete diário de leitura (notificação local agendada)
  flutter_local_notifications: ^19.4.0
  timezone: ^0.10.0
  flutter_timezone: ^4.1.1
  image_picker: ^1.0.7
  # Atualizado para resolver conflito com pdfrx (ambos agora usam web ^1.0.0)
  share_plus: ^12.0.1 
  file_picker: ^8.0.0
  flutter_rating_bar: ^4.0.1
  # --- NOVAS DEPENDÊNCIAS PARA EBOOK ---
  pdfrx: ^1.1.4 
  epub_view: ^3.0.1
  path_provider: ^2.1.0
  archive: ^3.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.3.0
  # Mantendo downgrade para resolver conflito com epub_view
  flutter_launcher_icons: ^0.11.0

flutter:
  uses-material-design: true

  # Fonte embutida: funciona offline (antes era baixada em tempo de execução)
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon.png"